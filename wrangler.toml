name = "revproxy-new"
main = "_worker.js"
compatibility_date = "2026-03-13"
keep_vars = true

# KV 命名空间绑定声明 (KV Namespace Binding)
[[kv_namespaces]]
binding = "ENI_KV" # 代码中调用该 KV 的变量名


# D1 数据库绑定声明 (D1 Database Binding)
[[d1_databases]]
binding = "DB" # 代码中调用该数据库的变量名
database_name = "orange-ey" # 你的 D1 数据库的名称
